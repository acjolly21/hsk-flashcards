        * {

        }
        
        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            font-size: 24px;
        }
        
        .filter-info {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .flashcard-container {
            width: 350px;
            height: 500px;
            margin-bottom: 30px;
        }
        
        .flashcard {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 40px;
            position: relative;
        }
        
        .chinese-char {
            font-family: 'Noto Serif SC', serif;
            font-size: 140px;
            color: #2d3748;
            line-height: 1;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
            margin-bottom: 30px;
            flex-shrink: 0;
        }
        
        .hidden-area {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }
        
        .cover-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .cover-button:hover {
            transform: translate(-50%, -50%) translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }
        
        .cover-button:active {
            transform: translate(-50%, -50%) translateY(0);
        }
        
        .cover-button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }
        
        .cover-icon {
            font-size: 28px;
        }
        
        .cover-text {
            font-size: 16px;
            letter-spacing: 1px;
        }
        
        .reveal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
        }
        
        .reveal-content.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .pinyin {
            font-size: 32px;
            color: #667eea;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .english {
            color: #4a5568;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0.5px;
            text-align: center;
            line-height: 1.4;
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: var(--english-font-size, 18px);
            max-height: 120px;
            overflow-y: auto;
        }
        
        /* Dynamic font size classes */
        .english.size-xl { --english-font-size: 22px; }
        .english.size-lg { --english-font-size: 20px; }
        .english.size-md { --english-font-size: 18px; }
        .english.size-sm { --english-font-size: 16px; }
        .english.size-xs { --english-font-size: 14px; }
        .english.size-xxs { --english-font-size: 12px; }
        
        .card-number {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 14px;
            color: #a0aec0;
            font-weight: 600;
        }
        
        .level-badge {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 11px;
            color: white;
            background: #48bb78;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .freq-badge {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 11px;
            color: #a0aec0;
            font-weight: 500;
        }
        
        .hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #cbd5e0;
            width: 100%;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 700px;
        }
        
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background: white;
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .reveal-all-btn {
            background: #48bb78;
            color: white;
        }
        
        .hide-all-btn {
            background: #ed8936;
            color: white;
        }
        
        .shuffle-btn {
            background: #4299e1;
            color: white;
        }
        
        .toggle-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        
        .progress {
            color: white;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .stats {

            font-size: 13px;
            margin-bottom: 15px;
            font-style: italic;
        }

            width: 50px;
            padding: 8px;
            border: none;
            border-radius: 15px;
            text-align: center;
            font-size: 13px;
        }
        
        .grid-view {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        
        .grid-card {
            background: white;
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }

            transform: translateY(-5px);
        }
        
        .grid-card .chinese-char {
            font-size: 55px;
            margin-bottom: 15px;
            margin-top: 0;
        }

            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            background: #48bb78;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .grid-cover-btn {
            width: 100%;
            height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .grid-cover-btn.hidden {
            display: none;
        }
        
        .grid-reveal-content {
            margin-top: 10px;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .grid-reveal-content.visible {
            opacity: 1;
            height: auto;

                height: 100px;

    </style>

        let currentIndex = 0;
        let currentData = [...flashcardsData];
        let revealedCards = new Set();
        let searchMode = false;

        function updateCard() {
            const card = currentData[currentIndex];
            
            // Update main content
            document.getElementById('chineseChar').textContent = card.cn;
            document.getElementById('pinyin').textContent = card.py;
            document.getElementById('english').textContent = card.en;
            
            // Update badges
            document.getElementById('cardNumber').textContent = `${currentIndex + 1}/${currentData.length}`;
            
            // HSK Level badge
            const levels = card.levels || [];
            const levelText = levels.length > 0 ? levels.join(', ') : 'HSK';
            document.getElementById('levelBadge').textContent = levelText;
            
            // Frequency badge
            const freq = card.freq || 0;
            document.getElementById('freqBadge').textContent = freq > 0 ? `#${freq}` : '';
            
            // Progress
            const searchPrefix = searchMode ? ' [Search]' : '';
            document.getElementById('progress').textContent = `Card ${currentIndex + 1} of ${currentData.length}${searchPrefix}`;
            
            // Reset reveal state
            const isRevealed = revealedCards.has(currentIndex);
            updateRevealState(isRevealed);
            
            // Apply dynamic font sizing
            adjustFontSize(card.en);
            
            updateStats();
        }

        function adjustFontSize(text) {
            const englishEl = document.getElementById('english');
            
            // Remove all size classes
            englishEl.classList.remove('size-xl', 'size-lg', 'size-md', 'size-sm', 'size-xs', 'size-xxs');
            
            // Calculate length and apply appropriate size
            const length = text.length;
            
            if (length < 20) {
                englishEl.classList.add('size-xl');      // 22px - very short
            } else if (length < 40) {
                englishEl.classList.add('size-lg');      // 20px - short
            } else if (length < 60) {
                englishEl.classList.add('size-md');      // 18px - medium
            } else if (length < 80) {
                englishEl.classList.add('size-sm');      // 16px - long
            } else if (length < 120) {
                englishEl.classList.add('size-xs');      // 14px - very long
            } else {
                englishEl.classList.add('size-xxs');     // 12px - extremely long
            }
        }

        function updateRevealState(isRevealed) {
            const coverBtn = document.getElementById('coverBtn');
            const revealContent = document.getElementById('revealContent');
            
            if (isRevealed) {
                coverBtn.classList.add('hidden');
                revealContent.classList.add('visible');
            } else {
                coverBtn.classList.remove('hidden');
                revealContent.classList.remove('visible');
            }
        }

        function revealAnswer(e) {
            e.stopPropagation();
            revealedCards.add(currentIndex);
            updateRevealState(true);
            updateStats();
        }

        function updateStats() {
            const pct = Math.round((revealedCards.size / currentData.length) * 100);
            document.getElementById('stats').textContent = 
                `Revealed: ${revealedCards.size}/${currentData.length} (${pct}%) • Space=Reveal • ←→=Navigate`;
        }

        function revealAll(e) {
            e.stopPropagation();
            for (let i = 0; i < currentData.length; i++) revealedCards.add(i);
            updateRevealState(true);
            updateStats();
        }

        function hideAll(e) {
            e.stopPropagation();
            revealedCards.clear();
            updateRevealState(false);
            updateStats();
        }

        function nextCard(e) {
            if(e) e.stopPropagation();
            currentIndex = (currentIndex + 1) % currentData.length;
            updateCard();
        }

        function prevCard(e) {
            if(e) e.stopPropagation();
            currentIndex = (currentIndex - 1 + currentData.length) % currentData.length;
            updateCard();
        }

        function jumpToCard(e) {
            if (e.key === 'Enter') {
                const num = parseInt(e.target.value);
                if (num >= 1 && num <= currentData.length) {
                    currentIndex = num - 1;
                    updateCard();
                    e.target.value = '';
                }
            }
        }

        function jumpToCardButton(e) {
            e.stopPropagation();
            const input = document.getElementById('jumpInput');
            const num = parseInt(input.value);
            if (num >= 1 && num <= currentData.length) {
                currentIndex = num - 1;
                updateCard();
                input.value = '';
            }
        }

        function shuffleCards(e) {
            e.stopPropagation();
            revealedCards.clear();
            for (let i = currentData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentData[i], currentData[j]] = [currentData[j], currentData[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function toggleView(e) {
            e.stopPropagation();
            const grid = document.getElementById('gridView');
            const container = document.getElementById('cardContainer');
            const controls = document.querySelector('.controls');
            const progress = document.querySelector('.progress');
            const stats = document.querySelector('.stats');
            const filter = document.querySelector('.filter-info');
            
            if (grid.style.display === 'none' || grid.style.display === '') {
                // Build grid
                grid.innerHTML = currentData.map((card, idx) => {
                    const levels = (card.levels || []).join(', ');
                    return `
                    <div class="grid-card">
                        <div class="grid-level">${levels}</div>
                        <div class="chinese-char">${card.cn}</div>
                        <button class="grid-cover-btn" id="grid-btn-${idx}" onclick="event.stopPropagation(); revealGrid(${idx})">
                            👆 Reveal
                        </button>
                        <div class="grid-reveal-content" id="grid-reveal-${idx}">
                            <div class="pinyin">${card.py}</div>
                            <div class="english">${card.en}</div>
                        </div>
                    </div>
                    `;
                }).join('');
                
                // Restore revealed state
                revealedCards.forEach(idx => {
                    const btn = document.getElementById(`grid-btn-${idx}`);
                    const content = document.getElementById(`grid-reveal-${idx}`);
                    if (btn && content) {
                        btn.classList.add('hidden');
                        content.classList.add('visible');
                    }
                });
                
                grid.style.display = 'grid';
                container.style.display = 'none';
                controls.style.display = 'none';
                progress.style.display = 'none';
                stats.style.display = 'none';
                if(filter) filter.style.display = 'none';
                e.target.textContent = '🎴 Card View';
            } else {
                grid.style.display = 'none';
                container.style.display = 'block';
                controls.style.display = 'flex';
                progress.style.display = 'block';
                stats.style.display = 'block';
                if(filter) filter.style.display = 'block';
                e.target.textContent = '📋 Grid View';
            }
        }

        function revealGrid(idx) {
            revealedCards.add(idx);
            const btn = document.getElementById(`grid-btn-${idx}`);
            const content = document.getElementById(`grid-reveal-${idx}`);
            if (btn && content) {
                btn.classList.add('hidden');
                content.classList.add('visible');
            }
            updateStats();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key) {
                case 'ArrowRight':
                    e.preventDefault();
                    nextCard();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    prevCard();
                    break;
                case ' ':
                case 'Enter':
                    e.preventDefault();
                    if (!revealedCards.has(currentIndex)) {
                        revealAnswer({ stopPropagation: () => {} });
                    }
                    break;
            }
        });

        // Initialize
        updateCard();
    </script>
